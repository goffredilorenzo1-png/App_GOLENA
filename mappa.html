<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Golena di Casalmaggiore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<style>
:root {
  --g: #6ba52a;
  --gl: #81c028;
  --gp: #eef5e0;
  --ink: #1a1a1a;
  --ink2: #484848;
  --muted: #8a8a8a;
  --sf: #ffffff;
  --sf2: #f6f6f4;
  --bd: rgba(0,0,0,0.07);
  --peek: 335px; 
  --sans: 'DM Sans', -apple-system, sans-serif;
  --serif: 'Fraunces', Georgia, serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--sans);background:#1c1c1e}

/* MAP */
#map{position:fixed;inset:0;z-index:1}
.leaflet-tile-pane{filter:saturate(.82) brightness(1.03)}

/* BACK & SHARE */
.btn-back, .btn-share {
  position:fixed;top:max(16px,env(safe-area-inset-top));z-index:50;
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:none;cursor:pointer;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 14px rgba(0,0,0,.13);transition:transform .15s;
}
.btn-back{left:16px}
.btn-share{right:16px}
.btn-back:active, .btn-share:active{transform:scale(.91)}

/* PULSANTE X IN ALTO A DESTRA (Solo in modalità Full) */
.btn-close-full {
  position: fixed;
  top: max(16px, env(safe-area-inset-top));
  right: 16px;
  z-index: 110;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,.92);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border: none; cursor: pointer; color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 14px rgba(0,0,0,.15);
  opacity: 0; pointer-events: none;
  transition: transform .15s, opacity .2s ease;
}
.btn-close-full:active { transform: scale(.91); }

/* CONTROLLI MAPPA A DESTRA */
.map-controls-right {
  position: fixed;
  right: 18px;
  bottom: calc(var(--peek) + 20px);
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  transition: bottom .42s cubic-bezier(.32,1,.64,1), opacity .25s ease;
}
.btn-locate{
  width:52px;height:52px;border-radius:50%;
  background:var(--g);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(107,165,42,.42);
  transition:transform .15s;
}
.btn-locate svg{width:22px;height:22px;fill:none;stroke:#fff;}
.btn-locate:active{transform:scale(.91)}

/* OVERLAY */
.overlay{
  position:fixed;inset:0;z-index:99;
  background:rgba(0,0,0,0);pointer-events:none;
  transition:background .35s ease;
}
.overlay.on{background:rgba(0,0,0,.3);pointer-events:auto}

/* SHEET */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  display:flex;flex-direction:column;
  background:var(--sf);
  border-radius:28px 28px 0 0;
  box-shadow:0 -1px 0 var(--bd), 0 -8px 40px rgba(0,0,0,.15);
  transform:translateY(100%);
  transition:transform .42s cubic-bezier(.32,1,.64,1), border-radius .3s;
  will-change:transform;
  max-height:100svh;
  height: 100svh;
  padding-bottom:max(16px, env(safe-area-inset-bottom));
  overflow:hidden;
}
.sheet.peek{transform:translateY(calc(100svh - var(--peek)))}
.sheet.full{transform:translateY(0)!important;border-radius:0;max-height:100svh!important;padding:0px}
.sheet.closed{transform:translateY(100%)!important}

/* PEEK ZONE (FOTO + TITOLO) */
.peek-zone{padding:0;flex-shrink:0;height:140px;overflow:hidden;position:relative}
.peek-hero{
  width:100%;height:100%;
  background:var(--sf2);background-size:cover;background-position:center;
  position:relative;border-radius:28px 28px 0 0;
}
.sheet.full .peek-hero{border-radius:0}
.peek-hero .hero-scrim{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.5) 0%,rgba(0,0,0,.1) 50%,transparent 100%);
}
.peek-hero .hero-label{position:absolute;bottom:0;left:0;right:0;padding:14px 20px;color:#fff}
.peek-hero .hero-num{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.7;margin-bottom:3px}
.peek-hero .hero-name{font-family:var(--serif);font-size:22px;font-weight:500;line-height:1.2}

.peek-hero .pill-wrap{
  position:absolute;top:0;left:0;right:0;
  padding:11px 0 5px;display:flex;justify-content:center;
  flex-shrink:0;cursor:grab;touch-action:none;z-index:10;
}
.peek-hero .pill-wrap:active{cursor:grabbing}
.peek-hero .pill{width:38px;height:4px;border-radius:999px;background:rgba(255,255,255,.6)}

/* CONTENT BODY */
.expanded-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:16px 18px 0;
}

/* Gestione del testo (Incipit vs Intero) */
.exp-desc{font-size:14px;line-height:1.6;color:var(--ink2);margin-bottom:16px;text-align:justify}
.preview-text { display: inline; }
.full-text { display: none; }

/* Pulsante "Leggi di più" IN LINEA */
.btn-read-more {
  display: inline; 
  background: none;
  border: none;
  color: var(--g);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  padding: 0;
  margin-left: 5px; 
  text-decoration: none;
}
.btn-read-more:active { opacity: 0.7; }

/* Cambiamenti in modalità FULL */
.sheet.full .preview-text { display: none; }
.sheet.full .full-text { display: inline; }
.sheet.full .btn-read-more { display: none; } 

/* NAVIGAZIONE TAPPE */
.nav-tappe-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.btn-nav-tappa {
  padding: 12px;
  border-radius: 12px;
  background: var(--sf2);
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  font-family: var(--sans);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s, opacity .15s;
}
.btn-nav-tappa:active:not(:disabled) { background: #e4e4e0; }
.btn-nav-tappa:disabled { opacity: 0.35; cursor: not-allowed; }

/* AUDIO PLAYER STYLE APPLE */
.audio-player{
  background:linear-gradient(135deg, #f5f5f7 0%, #ffffff 100%);
  border-radius:16px;padding:16px;margin-top:16px;margin-bottom:16px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.btn-play-pause{
  width:52px;height:52px;border-radius:50%;background:var(--g);border:none;
  color:#fff;font-size:20px;font-weight:600;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s,background .15s;
  box-shadow:0 4px 16px rgba(107,165,42,.3);
}
.btn-play-pause:active{transform:scale(.95)}
.player-info{flex:1;min-width:0}
.progress-container{
  display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(0,0,0,.6);font-weight:600;font-family:var(--sans);
}
.progress-bar{
  flex:1;height:4px;background:rgba(0,0,0,.1);border-radius:2px;position:relative;cursor:pointer;}
.progress-fill{
  height:100%;background:var(--g);border-radius:2px;width:0%;transition:width .1s linear;}
.progress-slider{
  position:absolute;width:100%;height:20px;top:50%;transform:translateY(-50%);opacity:0;cursor:pointer;}
.time-current,.time-duration{min-width:32px;text-align:center;}

/* TOAST */
.toast{
  position:fixed;left:16px;right:16px;z-index:200;
  bottom:calc(var(--peek) + 14px);
  background:rgba(22,22,24,.94);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-radius:20px;padding:14px 16px;
  transform:translateY(16px);opacity:0;pointer-events:none;
  transition:transform .38s cubic-bezier(.32,1,.64,1),opacity .35s ease;
}
.toast.show{transform:translateY(0);opacity:1;pointer-events:auto}
.toast-row{display:flex;align-items:flex-start;gap:12px}
.toast-dot{
  width:36px;height:36px;border-radius:50%;
  background:var(--g);display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;
}
.toast-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px}
.toast-sub{font-size:12px;color:rgba(255,255,255,.55)}
.toast-cta{
  margin-top:10px;width:100%;padding:9px;border-radius:11px;
  background:var(--g);border:none;cursor:pointer;
  font-size:13px;font-weight:700;color:#fff;font-family:var(--sans);
}

/* MARKERS */
.m-pin{
  width:38px;height:38px;border-radius:50%;
  background:var(--gl);border:3px solid #fff;
  box-shadow:0 2px 10px rgba(0,0,0,.22);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;font-weight:700;
  font-family:var(--sans);cursor:pointer;
  transition:transform .2s,background .2s;
}
.m-pin.sel{background:var(--ink);transform:scale(1.2);box-shadow:0 4px 18px rgba(0,0,0,.32)}

/* GOOGLE MAPS STYLE GPS POINTER & CONE */
.user-location-marker {
  width: 44px;
  height: 44px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.user-cone {
  position: absolute;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle at 50% 50%, rgba(0, 122, 255, 0.4) 0%, rgba(0, 122, 255, 0) 60%);
  clip-path: polygon(50% 50%, 28% 0%, 72% 0%);
  transform-origin: 50% 50%;
  transform: rotate(0deg);
  display: none;
  transition: transform 0.1s ease-out;
  z-index: 1;
}
.user-dot {
  position: absolute;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #007aff;
  border: 3px solid #fff;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  z-index: 2;
}

/* LEAFLET OVERRIDES */
.leaflet-control-zoom{border:none!important;box-shadow:0 2px 14px rgba(0,0,0,.1)!important;margin:0!important}
.leaflet-control-zoom-in,.leaflet-control-zoom-out{
  background:#fff!important;color:var(--g)!important;border:none!important;
  width:44px!important;height:44px!important;font-size:19px!important;font-weight:600!important;line-height:44px!important;
}
.leaflet-control-zoom-in{border-radius:16px 16px 0 0!important}
.leaflet-control-zoom-out{border-radius:0 0 16px 16px!important}
.leaflet-control-attribution{display:none}
</style>
</head>
<body>

<div id="map"></div>

<button class="btn-back" id="btnBack">
  <svg width="10" height="16" viewBox="0 0 10 16" fill="none"><path d="M8.5 1.5L1.5 8L8.5 14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<button class="btn-share" id="btnShare" title="Condividi">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
</button>

<button class="btn-close-full" id="btnCloseFull" title="Chiudi Tappa">
  <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M13 1L1 13M1 1L13 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<div class="map-controls-right" id="mapControls">
  <button class="btn-locate" id="btnLocate">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-crosshair" viewBox="0 0 16 16">
      <path d="M8.5.5a.5.5 0 0 0-1 0v.518A7 7 0 0 0 1.018 7.5H.5a.5.5 0 0 0 0 1h.518A7 7 0 0 0 7.5 14.982v.518a.5.5 0 0 0 1 0v-.518A7 7 0 0 0 14.982 8.5h.518a.5.5 0 0 0 0-1h-.518A7 7 0 0 0 8.5 1.018zm-6.48 7A6 6 0 0 1 7.5 2.02v.48a.5.5 0 0 0 1 0v-.48a6 6 0 0 1 5.48 5.48h-.48a.5.5 0 0 0 0 1h.48a6 6 0 0 1-5.48 5.48v-.48a.5.5 0 0 0-1 0v.48A6 6 0 0 1 2.02 8.5h.48a.5.5 0 0 0 0-1zM8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4"/>
    </svg>
  </button>
</div>

<div class="overlay" id="overlay"></div>

<div class="sheet closed" id="sheet">
  <div class="peek-zone" id="peekZone">
    <div class="peek-hero" id="peekHero">
      <div class="hero-scrim"></div>
      <div class="hero-label">
        <div class="hero-num" id="peekNum">TAPPA 01</div>
        <div class="hero-name" id="peekName">&nbsp;</div>
      </div>
      <div class="pill-wrap" id="pillWrap"><div class="pill"></div></div>
    </div>
  </div>

  <div class="expanded-body" id="expandedBody">
    <p class="exp-desc">
      <span class="preview-text" id="expDescPreview">&nbsp;</span>
      <button class="btn-read-more" id="btnReadMore">Leggi di più...</button>
      <span class="full-text" id="expDescFull">&nbsp;</span>
    </p>
    
    <div class="nav-tappe-container">
      <button class="btn-nav-tappa" id="btnPrevTappa">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left-short" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5"/>
        </svg> 
        Precedente
      </button>
      <button class="btn-nav-tappa" id="btnNextTappa">
        Successiva 
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-right-short" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M4 8a.5.5 0 0 1 .5-.5h5.793L8.146 5.354a.5.5 0 1 1 .708-.708l3 3a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708-.708L10.293 8.5H4.5A.5.5 0 0 1 4 8"/>
        </svg>
      </button>
    </div>

    <div class="audio-player">
      <button class="btn-play-pause" id="btnPlayPause">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-play-fill" viewBox="0 0 16 16">
          <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/>
        </svg>
      </button>
      <div class="player-info">
        <div class="progress-container">
          <span class="time-current" id="timeCurrent">0:00</span>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
            <input type="range" class="progress-slider" id="progressSlider" min="0" max="100" value="0">
          </div>
          <span class="time-duration" id="timeDuration">0:00</span>
        </div>
      </div>
    </div>
    <audio id="sheetAudio" hidden></audio>
  </div>
</div>

<div class="toast" id="toast">
  <div class="toast-row">
    <div class="toast-dot">📍</div>
    <div>
      <div class="toast-title" id="toastTitle">Sei vicino!</div>
      <div class="toast-sub" id="toastSub">&nbsp;</div>
    </div>
  </div>
  <button class="toast-cta" id="toastBtn">Vedi i dettagli</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script>
const tappe = [
  {id:1,  title:"Introduzione",               lat:44.995062,lng:10.407126, image:"IMG/001.jpg", audio:"Audio/tappa 1.mp4", desc:"Gentili visitatori che avete scelto di addentrarvi in questo percorso naturalistico, lasciatevi guidare nel suggestivo spazio della golena del Po, dove le lento scorrere del grande fiume si unisce alla quiete della natura incontaminata. Attraversando sentieri ombreggiati, potrete immergervi in un paesaggio ricco di fascino, popolato da numerose specie di uccelli e caratterizzato dai colori mutevoli delle stagioni. Questo itinerario vi offrirà non soltanto l'occasione di conoscere più da vicino l'ambiente fluviale, ma anche di riscoprire un rapporto autentico con la natura, in un luogo in cui storia, equilibrio idraulico e biodiversità convivono armoniosamente."},
  {id:2,  title:"Argine Maestro",             lat:44.995056,lng:10.407139, image:"IMG/002.jpg", audio:"Audio/tappa 2.mp4", desc:"Vi trovate ora sull'argine maestro del fiume. Quest'opera di fondamentale importanza è stata realizzata lungo le rive allo scopo di contenere le acque durante i periodi di piena e di prevenire le esondazioni. L'argine maestro costituisce una barriera artificiale che protegge i centri abitati, le campagne e le vie di comunicazione dai danni provocati dall'impetuosità del corso d'acqua. Oltre alla funzione di difesa, l'argine maestro svolge anche un ruolo di regolazione del flusso fluviale, contribuendo a mantenere più stabile il percorso del fiume e a limitare i fenomeni di erosione delle sponde. Fin dall'antichità, civiltà come quella romana attribuirono grande importanza alla costruzione degli argini, riconoscendo nel controllo delle acque una conditione essenziale per la sicurezza del territorio e per lo sviluppo dell'agricoltura e dei commerci."},
  {id:3,  title:"Arginello Comprensoriale",     lat:44.994389,lng:10.406861, image:"IMG/003.jpg", audio:"Audio/tappa 3.mp4", desc:"Vi invitiamo ora a percorrere per un breve tratto l'arginello comprensoriale. Si tratta di un'opera idraulica secondaria destinata a integrare la funzione degli argini maestri, contribuendo alla difesa del territorio dalle acque in eccedenza. Esso viene generalmente costruito all'interno dei comprensori di bonifica per regolare il deflusso delle acque piovane e impedire l'allagamento delle zone agricole e dei centri abitati circostanti. La sua funzione non è soltanto protettiva, ma anche organizzativa, poiché consente una più razionale gestione delle risorse idriche e favorisce la conservazione dell'equilibrio del territorio. In tal modo, l'arginello comprensoriale rappresenta uno strumento essenziale per la tutela dell'ambiente rurale e per la sicurezza delle attività umane, specialmente nelle aree soggette a frequenti precipitazioni o a rischio idrogeologico."},
  {id:4,  title:"Ingresso in Golena",         lat:44.994889,lng:10.405583, image:"IMG/004.jpg", audio:"Audio/tappa 4.mp4", desc:"Stiamo per entrare nella Golena, ovvero la fascia di terreno pianeggiante compresa tra il Po e l'arginello comprensoriale. Essa rappresenta uno spazio naturale destinato ad accogliere temporaneamente le acque durante i periodi di piena. Dal punto di vista idraulico, la golena permette l'espansione e il contenimento delle acque, contribuendo all'equilibrio del sistema fluviale. La golena è detta aperta, quando si trova tra il fiume e i primi arginelli, oppure chiusa, quando è compresa tra i primi arginelli e l'argine maestro. Fin dall'antichità, le popolazioni insediate lungo i grandi fiumi compresero l'importanza della golena, sia come elemento di protezione del territorio sia come risorsa per l'agricoltura, grazie alla fertilità dei terreni arricchiti dai sedimenti depositati dalle piene. Questo ambiente è di notevole valore naturalistico, poiché favorisce la presenza di vegetazione ripariale e di numerose specie animali legate agli ecosistemi umidi."},
  {id:5,  title:"Le Querce",                  lat:44.994806,lng:10.405556, image:"IMG/005.jpg", audio:"Audio/tappa 5.mp4", desc:"Vi invitiamo ad osservare queste due bellissime querce secolari, che segnano l'ingresso in golena aperta. La quercia è uno degli alberi più importanti e rappresentativi degli ambienti golenali, e svolge una funzione fondamentale sia dal punto di vista ecologico sia paesaggistico. Essa appartiene spesso a specie adattate ai terreni umidi e fertili, ricchi di sostanze organiche depositate dalle acque del fiume. Tra le più diffuse vi sono la farnia, che notate sulla destra, conosciuta come *Quercus robur*, caratterizzata da un tronco robusto, una chioma ampia e foglie lobate di colore verde intenso. Dal punto di vista botanico, la quercia è un albero longevo: può vivere diversi secoli e raggiungere dimensioni notevoli. Il suo apparato radicale è profondo e resistente, qualità che permette di consolidare il terreno della golena e limitare l'erosione provocata dalla corrente del fiume. La corteccia, spessa e rugosa, protegge l'albero dagli sbalzi climatici e dagli agenti atmosferici."},
  {id:6,  title:"La Golena",                  lat:44.994500,lng:10.405222, image:"IMG/006.jpg", audio:"Audio/tappa 6.mp4", desc:"L'ambiente golenale presenta condizioni particolari: durante alcune stagioni il terreno può risultare allagato, mentre nei periodi estivi può diventare più secco. La quercia riesce ad adattarsi a tali variazioni grazie alla sua notevole capacità di resistenza. Inoltre, essa contribuisce alla biodiversità dell'ecosistema, offrendo rifugio e nutrimento a numerose specie animali, come uccelli, insetti e piccoli mammiferi. Dal punto di vista storico e simbolico, la quercia è sempre stata considerata emblema di forza, stabilità e durata nel tempo. Nella cultura classica era associata alla solidità morale e al legame con la natura. Il percorso ora prosegue percorrendo la breve discesa e svoltando a sinistra, camminando ai piedi dell'arginello comprensoriale."},
  {id:7,  title:"La Vegetazione",             lat:44.994278,lng:10.407028, image:"IMG/007.jpg", audio:"Audio/tappa 7.mp4", desc:"Percorrendo uno dei più suggestivi sentieri golenali, si ha l'impressione di entrare in un ambiente naturale ancora legato ai ritmi lenti dell'acqua e delle stagioni. Il terreno, spesso umido e ricco di sedimenti lasciati dalle piene, favorisce la crescita di una vegetazione varia e rigogliosa, tipica degli ambienti fluviali. La vegetazione della golena cambia continuamente aspetto nel corso delle stagioni. In primavera prevalgono il verde intenso delle foglie giovani e la fioritura delle erbe spontanee; in estate la vegetazione diventa più fitta e ombrosa; in autunno il paesaggio si colora di tonalità gialle, rosse e marroni, mentre d'inverno gli alberi spogli mostrano la struttura intricata dei rami. Nelle aree di golena crescono spesso cespugli come il pruno selvatico e il biancospino, piante molto resistenti ai terreni umidi e alle variazioni del livello dell'acqua. Il pruno selvatico produce piccoli frutti scuri ed è caratterizzato da rami spinosi, mentre il biancospino si riconosce per i suoi fiori bianchi primaverili e le bacche rosse autunnali. Questi arbusti formano fitte siepi naturali che offrono riparo e nutrimento a molti uccelli e piccoli animali, contribuendo alla biodiversità dell'ambiente golenale. Camminando in questo ambiente si comprende come la vegetazione della golena non abbia soltanto un valore estetico, ma svolga anche una funzione fondamentale per l'equilibrio del fiume. Le radici trattengono il terreno, limitano l'erosione e contribuiscono a mantenere stabile l'ecosistema fluviale. La golena appare così come un luogo in cui acqua, terra e vegetazione convivono in un equilibrio naturale delicato ma essenziale."},
  {id:8,  title:"Il Pioppeto",                lat:44.992194,lng:10.409333, image:"IMG/008.jpg", audio:"Audio/tappa 8.mp4", desc:"Potete ammirare ora sulla vostra sinistra un pioppeto piantumato. La coltivazione dei pioppi nelle zone golenali è una pratica molto diffusa grazie alla particolare fertilità dei terreni vicini ai fiumi. Prima della messa a dimora delle piante, il terreno viene preparato con lavorazioni che favoriscono il drenaggio e la crescita delle radici. I pioppi vengono generalmente piantati attraverso talee o giovani piantine disposte in filari regolari, così da facilitare la crescita e le operazioni di manutenzione. La distanza tra gli alberi è studiata per garantire sia un corretto sviluppo delle chiome ma soprattutto per permettere il passaggio dei mezzi agricoli. Durante la crescita delle pioppete infatti sono necessarie cure costanti, come irrigazione nei periodi più secchi, controllo delle erbe infestanti e trattamenti contro parassiti e malattie. Dopo circa dieci o quindici anni, gli alberi raggiungono dimensioni sufficienti per il taglio e la raccolta del legno. Dal punto di vista economico, il pioppo rappresenta una risorsa importante perché il suo legno è leggero, versatile e facilmente lavorabile. Viene utilizzato soprattutto per la produzione di compensato, carta, cassette per la frutta, mobili e imballaggi industriali. La coltivazione intensiva dei pioppi nelle aree golenali ha quindi favorito lo sviluppo di attività produttive legate all'industria del legno, creando una fonte di reddito per molte aziende agricole e forestali."},
  {id:9,  title:"Pioppi Selvatici",           lat:44.989667,lng:10.407444, image:"IMG/009.jpg", audio:"Audio/tappa 9.mp4", desc:"Vi trovate ora sulla via che attraversa l'area golenale, e prosegue verso nord ovest costeggiando a breve distanza il corso del fiume Po. A differenza del pioppo piantumato potete osservare attorno a voi quello a crescita spontanea. Si tratta di un albero elegante e slanciato, capace di raggiungere notevoli altezze grazie all'abbondanza d'acqua e alla fertilità del terreno. Il suo fusto è generalmente diritto e robusto, con una forma verticale che permette alla pianta di svilupparsi rapidamente verso la luce. Nei pioppi più giovani la corteccia appare liscia e chiara, di colore grigio-biancastro, mentre negli esemplari più maturi diventa più scura, rugosa e segnata da profonde fenditure. Il fogliame è leggero e fitto, di un colore verde brillante sulla superficie superiore, più chiaro nella parte inferiore. Durante le giornate ventose le foglie si muovono continuamente, producendo un caratteristico tremolio e un fruscio delicato che rende il pioppo facilmente riconoscibile. Nel periodo autunnale il fogliame assume tonalità giallo-dorate, contribuendo a creare il tipico paesaggio delle aree fluviali. Grazie alla sua imponenza e alla rapidità della crescita, il pioppo rappresenta uno degli alberi più simbolici e diffusi degli ambienti golenali."},
  {id:10, title:"Gli Olmi",                   lat:44.989861,lng:10.407000, image:"IMG/010 .jpg", audio:"Audio/tappa 10.mp4", desc:"Anche l'olmo è una pianta tipica degli ambienti golenali, apprezzata per la sua imponenza e la capacità di adattarsi ai terreni fertili vicini ai corsi d'acqua. Il suo fusto è solido e robusto, spesso molto alto, con una chioma ampia e arrotondata che offre ombra e riparo a numerose specie animali. La corteccia dell'olmo, liscia negli alberi giovani, con il passare degli anni diventa spessa, scura e profondamente solcata da fenditure verticali. Questo aspetto rugoso conferisce alla pianta un carattere maestoso e antico. Le radici sono forti e ben sviluppate, adatte a stabilizzare il terreno delle zone golenali soggette alle piene dei fiumi. Il fogliame è fitto e compatto: le foglie, di colore verde intenso hanno una superficie leggermente ruvida al tatto. In autunno assumono tonalità giallastre prima di cadere. La chioma dell'olmo crea ambienti freschi e ombrosi, importanti per l'equilibrio dell'ecosistema fluviale. Negli ultimi decenni, però, molti olmi sono stati colpiti dalla grafiosi, una grave malattia causata da un fungo trasportato da insetti parassiti chiamati scolitidi. Questa infezione ostruisce i vasi interni della pianta, impedendo il passaggio della linfa e provocando il progressivo disseccamento dei rami fino, spesso, alla morte dell'albero. La diffusione della grafiosi ha ridotto notevolmente la presenza dell'olmo in molte aree europee."},
  {id:11, title:"I Salici",                   lat:44.990139,lng:10.404250, image:"IMG/011.jpg", audio:"Audio/tappa 11.mp4", desc:"Anche il salice è un tipico arbusto della zona. Nello specifico è possibile incontrarne di due tipi. Il salice piangente è un albero ornamentale facilmente riconoscibile per i suoi lunghi rami sottili e pendenti, che ricadono verso il basso fino a sfiorare il terreno o l'acqua. Può raggiungere dimensioni notevoli. Le sue foglie sono strette e allungate, di colore verde chiaro, e contribuiscono a rendere elegante la sua forma elegante. Il salice da fiume, invece, ha una struttura meno ornamentale e più resistente, con rami flessibili capaci di sopportare le piene e la forza dell'acqua. Le sue radici contribuiscono a consolidare il terreno e a limitare l'erosione delle sponde. Questo tipo di salice cresce spesso in gruppi lungo i corsi d'acqua e svolge un'importante funzione ecologica, offrendo riparo a numerose specie animali."},
  {id:12, title:"La Lanca",                   lat:44.990139,lng:10.404083, image:"IMG/012.jpg", audio:"Audio/tappa 12.mp4", desc:"Durante il percorso, prima di arrivare al ponticello avete sicuramente notato un torretta di avvistamento attualmente chiusa al pubblico. Da li è possibile osservare una lanca tipico elemento paesaggistico delle golene. Nello specifico questa ha una formazione particolare, essendo ciò che rimane di cava utilizzata per l'estrazione dell'argilla, in funzione fino alla fine degli anni sessanta. In realtà nelle zone golenali le lanche derivano dall'evoluzione naturale dei meandri, cioè delle grandi curve del fiume che in pianura cambia spesso il suo corso a causa di erosione, trasporto e sedimentazione. Quando c'è molta acqua soprattutto durante le piene, il fiume può modificare il proprio tracciato. Nel corso del tempo la corrente erode la parte esterna del meandro, dove l'acqua scorre più velocemente, mentre nella parte interna deposita sabbia e sedimenti. In questo modo la curva diventa sempre più stretta. Durante una piena il fiume può aprirsi un percorso più diretto, tagliando il tratto di terra che separa due anse vicine. Il vecchio meandro viene quindi abbandonato dal corso principale del fiume e rimane isolato. Nasce così la lanca, uno specchio d'acqua fermo, spesso a forma di ferro di cavallo. I bodri invece sono piccoli specchi d'acqua tipici delle zone golenali e delle pianure attraversate dai fiumi. Si formano in depressioni del terreno dove l'acqua ristagna o riaffiora dal sottosuolo, creando ambienti umidi ricchi di vegetazione acquatica. Attorno ai bodri crescono spesso canneti, salici e altre piante adatte ai terreni molto umidi. Sia le lanche che i bodri sono ambienti che hanno una grande importanza ecologica perché offrono rifugio e nutrimento a numerose specie di anfibi, insetti, uccelli e piccoli animali e rappresentano quindi ecosistemi delicati e preziosi, fondamentali per la biodiversità delle aree fluviali e golenali."},
  {id:13,  title:"La Lanca - Pt. 2",          lat:44.990361,lng:10.403444, image:"IMG/013.jpg", audio:"Audio/tappa 13.mp4", desc:"Le lanche fluviali rappresentano ambienti di grande importanza per la fauna ittica, poiché le loro acque calme e ricche di vegetazione offrono condizioni ideali per la vita e la riproduzione di numerose specie di pesci. Si trovano la carpa e la tinca, pesci resistenti che prediligono acque lente e ricche di sostanze nutritive. Sono presenti anche il luccio, importante predatore degli ambienti fluviali, il persico reale e il pesce gatto. In alcune lanche vivono inoltre anguille e piccoli ciprinidi, che trovano rifugio tra le canne e la vegetazione acquatica. La vegetazione sommersa e i canneti svolgono una funzione fondamentale, poiché offrono protezione agli avannotti e favoriscono la deposizione delle uova. Le lanche costituiscono quindi vere e proprie aree di riproduzione e crescita per molte specie ittiche, contribuendo alla biodiversità dell'ecosistema fluviale. Tuttavia questi ambienti sono molto delicati e minacciati dall'inquinamento delle acque, dalla riduzione delle zone umide e dall'introduzione di specie invasive. Anche gli interventi artificiali sul corso dei fiumi possono alterare l'equilibrio naturale delle lanche, mettendo a rischio la sopravvivenza della fauna ittica che vi abita. Ci spostiamo di nuovo sulla strada e risalendo verso sinistra imbocchiamo il sentiero indicato che ci riporterà al punto di partenza."},
  {id:14,  title:"La Fauna Golenale",         lat:44.990139,lng:10.404472, image:"IMG/014.jpg", audio:"Audio/tappa 14.mp4",desc:"Durante il tragitto è possibile imbattersi nella fauna golenale molto ricca e diversificata, In questi ambienti vivono numerose specie di uccelli, alcune strettamente legate all'acqua, altre tipiche dei boschi golenali e dei campi coltivati circostanti. La grande varietà di habitat rende il medio corso del Po un ecosistema di straordinaria importanza naturalistica, tanto che il 19 giugno 2019 questo territorio è stato riconosciuto come Riserva della Biosfera UNESCO MaB – Po Grande. Tra gli uccelli acquatici più diffusi vi è il germano reale, oggi però minacciato dal fenomeno dell'ibridazione con esemplari allevati dall'uomo. L'incrocio tra individui selvatici e domestici altera progressivamente il patrimonio genetico originario della specie, compromettendone la purezza in modo irreversibile. Anche la presenza dei gabbiani è aumentata notevolmente negli ultimi anni nella Pianura Padana. Questo fenomeno è favorito soprattutto dalla grande quantità di rifiuti prodotti dall'uomo, che offre a questi uccelli abbondanti fonti di cibo. La crescita incontrollata della popolazione dei gabbiani ha però causato squilibri nell'ecosistema, contribuendo alla diminuzione di altre specie più fragili."},
  {id:15, title:"La Fauna Golenale - Pt. 2",  lat:44.990084,lng:10.406322, image:"IMG/015.jpg", audio:"Audio/tappa 15.mp4", desc:"Nei boschi golenali trovano rifugio e luoghi adatti alla nidificazione molte specie di piccoli uccelli e rapaci. Tuttavia, anche questi ambienti sono oggi minacciati dalle attività umane. I passeri, ad esempio, hanno subito una drastica diminuzione, stimata intorno al sessanta per cento, principalmente a causa dell'inquinamento, dell'agricoltura intensiva e della presenza di numerosi predatori. Ancora più delicata è la situazione dei rapaci notturni, come civette e allocchi, la cui sopravvivenza è ostacolata dalla progressiva scomparsa degli alberi cavi necessari alla nidificazione e dall'avvelenamento provocato dai pesticidi utilizzati nelle coltivazioni."},
  {id:16, title:"La Fauna Golenale - Pt. 3",  lat:44.992503,lng:10.407220, image:"IMG/016.jpg", audio:"Audio/tappa 16.mp4", desc:"La presenza di boschi, corsi d'acqua, radure e vegetazione fitta offre condizioni favorevoli per la vita di molti mammiferi, che trovano nelle golene rifugio, acqua e abbondanza di cibo. Tra gli animali più diffusi vi sono i cinghiali, particolarmente adatti agli ambienti umidi e boscati. Questi animali scavano il terreno alla ricerca di radici, ghiande e piccoli organismi, contribuendo a modificare il sottobosco. In queste aree vivono anche i caprioli, animali eleganti e molto schivi, che frequentano soprattutto le aree più tranquille dei boschi golenali e i margini dei campi coltivati. Nelle radure e nei prati vicini al fiume è frequente osservare le lepri, riconoscibili per le lunghe orecchie e la grande velocità nella corsa. Le lepri si nutrono principalmente di erbe e giovani germogli e rappresentano una presenza tipica degli ambienti fluviali e agricoli della Pianura Padana. Tra i predatori più comuni della golena vi è invece la volpe, animale molto intelligente e adattabile. La volpe vive sia nei boschi sia nelle aree aperte e si alimenta di piccoli mammiferi, insetti, uccelli e frutti. Grazie alla sua capacità di adattamento riesce a sopravvivere anche in ambienti modificati dall'uomo."},
  {id:17, title:"L' Area Golenale",           lat:44.992450,lng:10.405804, image:"IMG/017.jpg", audio:"Audio/tappa 17.mp4", desc:"Lungo le rive del fiume è inoltre diffusa la nutria, roditore originario del Sud America introdotto artificialmente nel secolo scorso. Questo animale si è rapidamente diffuso nelle zone umide italiane, causando però danni agli argini fluviali a causa delle gallerie che scava nel terreno. La fauna di grandi taglie delle golene rappresenta dunque un elemento fondamentale dell'ecosistema fluviale. Tuttavia, l'espansione urbana, l'inquinamento e la riduzione degli spazi naturali minacciano sempre più questi ambienti, rendendo necessaria una maggiore tutela della biodiversità delle aree golenali. L'ambiente golenale appare quindi come un ecosistema prezioso ma fragile, in cui la conservazione della biodiversità dipende sempre più dalla capacità dell'uomo di proteggere e rispettare gli equilibri naturali del territorio fluviale."},
  {id:18, title:"The End",                    lat:44.994376,lng:10.405214, image:"IMG/018.jpg", audio:"Audio/tappa 18.mp4", desc:"La visita alla golena del Po permette di comprendere quanto questo ambiente sia ricco, complesso e delicato. Attraverso l'osservazione della vegetazione, delle lanche, dei boschi golenali e delle numerose specie animali che popolano il territorio, emerge il profondo legame tra il fiume e l'ecosistema che vi si sviluppa intorno. La golena non rappresenta soltanto uno spazio naturale di grande valore paesaggistico, ma anche un luogo fondamentale per la conservazione della biodiversità e per l'equilibrio ambientale della Pianura Padana. Tuttavia, questo patrimonio naturale è oggi minacciato dall'inquinamento, dall'espansione delle attività umane e dai cambiamenti climatici. Per questo motivo è necessario promuovere una maggiore tutela del territorio fluviale, affinché le future generazioni possano continuare a conoscere e apprezzare la straordinaria ricchezza ambientale del Po. La golena insegna infatti come uomo e natura siano profondamente legati e come il rispetto degli equilibri naturali sia indispensabile per la salvaguardia dell'ambiente."}
];

/* MAP SETUP */
const map = L.map('map',{zoomControl:false}).setView([44.9888,10.4215],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

const zoomControl = L.control.zoom().addTo(map);
document.getElementById('mapControls').appendChild(zoomControl.getContainer());

const pts = tappe.map(t=>[t.lat,t.lng]);
L.polyline(pts,{color:'#81c028',weight:14,opacity:.12}).addTo(map);
L.polyline(pts,{color:'#6ba52a',weight:5,opacity:.9,dashArray:'10,7'}).addTo(map);

let selIdx=-1;

const mMarkers = tappe.map((t,i)=>{
  const el = document.createElement('div');
  el.className='m-pin'; el.textContent=i+1; el.dataset.id=t.id;
  const icon=L.divIcon({html:el.outerHTML,iconSize:[38,38],className:''});
  const m=L.marker([t.lat,t.lng],{icon}).addTo(map);
  m.on('click',()=>{ selectTappa(i); map.panTo([t.lat,t.lng],{animate:true,duration:.35}); });
  return m;
});
map.fitBounds(L.polyline(pts).getBounds(),{padding:[60,60]});

/* SHEET & ANIMATION CONTROLS */
const sheet=document.getElementById('sheet');
const overlay=document.getElementById('overlay');
const pillWrap=document.getElementById('pillWrap');
const btnLocate=document.getElementById('btnLocate');
const btnCloseFull=document.getElementById('btnCloseFull');
const btnReadMore=document.getElementById('btnReadMore');
const btnPlayPause=document.getElementById('btnPlayPause');
const progressSlider=document.getElementById('progressSlider');
const progressFill=document.getElementById('progressFill');
const timeCurrent=document.getElementById('timeCurrent');
const timeDuration=document.getElementById('timeDuration');
const sheetAudio=document.getElementById('sheetAudio');
const mapControlsContainer=document.getElementById('mapControls');
let snap='closed';

function updateControlsPosition() {
  if (snap === 'full' || snap === 'closed') {
    mapControlsContainer.style.opacity = (snap === 'closed') ? '1' : '0';
    mapControlsContainer.style.pointerEvents = (snap === 'closed') ? 'auto' : 'none';
    if(snap === 'closed') mapControlsContainer.style.bottom = '20px';
    return;
  }
  mapControlsContainer.style.opacity = '1';
  mapControlsContainer.style.pointerEvents = 'auto';
  const peekPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--peek')) || 335;
  mapControlsContainer.style.bottom = (peekPx + 16) + 'px';
}

function setSnap(s, instant) {
  snap = s;
  if (instant) { 
    sheet.style.transition = 'none'; 
    requestAnimationFrame(() => { sheet.style.transition = ''; }); 
  }
  
  sheet.classList.toggle('peek', s === 'peek');
  sheet.classList.toggle('full', s === 'full');
  sheet.classList.toggle('closed', s === 'closed');
  overlay.classList.toggle('on', s === 'full');
  
  sheet.style.transform = '';
  
  if (s === 'full') {
    document.getElementById('expandedBody').scrollTop = 0;
    btnCloseFull.style.opacity = '1';
    btnCloseFull.style.pointerEvents = 'auto';
  } else {
    btnCloseFull.style.opacity = '0';
    btnCloseFull.style.pointerEvents = 'none';
  }
  
  updateControlsPosition();
}

window.addEventListener('resize', updateControlsPosition);

function selectTappa(idx){
  if (idx < 0 || idx >= tappe.length) return;
  selIdx=idx;
  stopAudio();
  fillSheet(tappe[idx]);
  setMarkerActive(idx);
  setSnap('peek');
}

function fillSheet(t){
  document.getElementById('peekNum').textContent=`TAPPA ${String(t.id).padStart(2,'0')}`;
  document.getElementById('peekName').textContent=t.title;
  document.getElementById('peekHero').style.backgroundImage=`url('${t.image}')`;
  
  const shortDesc = t.desc.slice(0, 65);
  document.getElementById('expDescPreview').textContent = shortDesc;
  document.getElementById('expDescFull').textContent = t.desc;
  
  setAudioSource(t);
  document.getElementById('btnPrevTappa').disabled = (selIdx === 0);
  document.getElementById('btnNextTappa').disabled = (selIdx === tappe.length - 1);
}

function speak(t){
  if(!window.speechSynthesis){alert('Audio non supportato.');return;}
  const u=new SpeechSynthesisUtterance(`Tappa ${t.id}: ${t.title}. ${t.desc}`);
  u.lang='it-IT';
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function setAudioSource(t){
  if (t.audio){
    sheetAudio.src = t.audio;
    sheetAudio.load();
  } else {
    sheetAudio.removeAttribute('src');
  }
  btnPlayPause.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-play-fill" viewBox="0 0 16 16"><path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/></svg>`;
  updateProgress();
}

function formatTime(seconds){
  if(!seconds||isNaN(seconds))return'0:00';
  const m=Math.floor(seconds/60);const s=Math.floor(seconds%60);
  return`${m}:${s.toString().padStart(2,'0')}`;
}

function updateProgress(){
  const percent=(sheetAudio.currentTime/sheetAudio.duration)*100||0;
  progressFill.style.width=percent+'%';
  progressSlider.value=percent;
  timeCurrent.textContent=formatTime(sheetAudio.currentTime);
  timeDuration.textContent=formatTime(sheetAudio.duration);
}

function togglePlayPause(){
  const t = tappe[selIdx];
  if (!t) return;
  if (sheetAudio.src){
    if (sheetAudio.paused){
      sheetAudio.play().then(()=>{ btnPlayPause.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pause-fill" viewBox="0 0 16 16"><path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5m5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5"/></svg>`; }).catch(()=>{});
    } else {
      sheetAudio.pause();
      btnPlayPause.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-play-fill" viewBox="0 0 16 16"><path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/></svg>`;    }
  } else {
    speak(t);
    btnPlayPause.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pause-fill" viewBox="0 0 16 16"><path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5m5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5"/></svg>`;
  }
}

function stopAudio(){
  if (sheetAudio.src){
    sheetAudio.pause();
    sheetAudio.currentTime = 0;
  }
  if (window.speechSynthesis) speechSynthesis.cancel();
  btnPlayPause.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-play-fill" viewBox="0 0 16 16"><path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/></svg>`;
  updateProgress();
}

sheetAudio.addEventListener('timeupdate', updateProgress);
sheetAudio.addEventListener('ended', ()=>{ btnPlayPause.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-play-fill" viewBox="0 0 16 16"><path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/></svg>`; });
sheetAudio.addEventListener('loadedmetadata', updateProgress);
progressSlider.addEventListener('input', (e)=>{ sheetAudio.currentTime=(e.target.value/100)*sheetAudio.duration; });

function setMarkerActive(idx){
  mMarkers.forEach((m,i)=>{
    const div=m.getElement()?.querySelector('.m-pin');
    if(div) div.classList.toggle('sel',i===idx);
  });
}

document.getElementById('btnBack').addEventListener('click',()=>window.location.href='index.html');
overlay.addEventListener('click',()=>setSnap('peek'));

btnReadMore.addEventListener('click', () => {
  setSnap('full');
});

btnCloseFull.addEventListener('click',()=>{
  setSnap('closed');
  setMarkerActive(-1);
  selIdx = -1;
});

document.getElementById('btnPrevTappa').addEventListener('click', () => {
  if (selIdx > 0) selectTappa(selIdx - 1);
});
document.getElementById('btnNextTappa').addEventListener('click', () => {
  if (selIdx < tappe.length - 1) selectTappa(selIdx + 1);
});

/* SHARE */
document.getElementById('btnShare').addEventListener('click', () => {
  let shareData = {
    title: 'Golena del Po',
    text: 'Esplora il percorso naturalistico della Golena del Po a Casalmaggiore.',
    url: window.location.href
  };
  if(selIdx !== -1) {
    shareData.title = `Golena del Po - Tappa ${tappe[selIdx].id}`;
    shareData.text = `Vedi la tappa "${tappe[selIdx].title}" sul percorso della Golena a Casalmaggiore.`;
  }
  if (navigator.share) {
    navigator.share(shareData).catch(err => console.log('Errore condivisione:', err));
  } else {
    navigator.clipboard.writeText(window.location.href);
    alert('Link copiato negli appunti!');
  }
});

/* DRAG & SLIDE LOGIC */
let drag=false,startY=0,lastY=0,velY=0;

pillWrap.addEventListener('pointerdown',e=>{
  if(snap==='closed') return;
  drag=true; startY=e.clientY; lastY=e.clientY; velY=0;
  sheet.style.transition='none';
  pillWrap.setPointerCapture(e.pointerId);
});

pillWrap.addEventListener('pointermove',e=>{
  if(!drag) return;
  velY=e.clientY-lastY; lastY=e.clientY;
  const d=e.clientY-startY;
  
  if(snap==='peek'){
    const peekPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--peek')) || 335;
    const currentTranslate = (window.innerHeight - peekPx) + d;
    sheet.style.transform=`translateY(${Math.max(0, currentTranslate)}px)`;
  } else {
    sheet.style.transform=`translateY(${Math.max(0, d)}px)`;
  }
});

pillWrap.addEventListener('pointerup',e=>{
  if(!drag) return; drag=false;
  sheet.style.transition='';
  const d=e.clientY-startY; const fast=Math.abs(velY)>6;
  
  if(snap==='peek'){
    if(d < -60 || (fast && velY < 0)) setSnap('full');
    else if(d > 80 || (fast && velY > 0)) { setSnap('closed'); setMarkerActive(-1); selIdx = -1; }
    else setSnap('peek',true);
  } else {
    if(d > 80 || (fast && velY > 0)) setSnap('peek');
    else setSnap('full',true);
  }
  pillWrap.releasePointerCapture(e.pointerId);
});

pillWrap.addEventListener('pointercancel',()=>{ drag=false; sheet.style.transition=''; setSnap(snap,true); });

let tapStart=0;
pillWrap.addEventListener('pointerdown',e=>{ tapStart=e.clientY; });
pillWrap.addEventListener('click',e=>{
  if(Math.abs(e.clientY-tapStart)>8) return;
  if(snap==='full') setSnap('peek'); else if(snap==='peek') setSnap('full');
});

/* GPS & COMPASS ORIENTATION LOGIC */
let uM=null,uC=null,uLoc=null,alerted=new Set(),toastTmr;
let currentHeading=null;

function hav(a,b,c,d){
  const R=6371000,p1=a*Math.PI/180,p2=c*Math.PI/180;
  const dp=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180;
  const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function onGPS(pos){
  const{latitude:lat,longitude:lng,accuracy:acc}=pos.coords;
  uLoc={lat,lng};
  
  if(!uM){
    // Creazione puntatore personalizzato con freccia/cono direzionale (Stile Google Maps)
    const userHtml = `<div class="user-location-marker"><div class="user-cone"></div><div class="user-dot"></div></div>`;
    const userIcon = L.divIcon({html: userHtml, iconSize: [44,44], iconAnchor: [22,22], className: ''});
    
    uM=L.marker([lat,lng],{icon: userIcon, zIndexOffset:1000}).addTo(map);
    uC=L.circle([lat,lng],acc,{color:'#007aff',fillColor:'#007aff',fillOpacity:.06,weight:1,dashArray:'4,4'}).addTo(map);
  } else { 
    uM.setLatLng([lat,lng]); 
    uC.setLatLng([lat,lng]).setRadius(acc); 
  }
  
  // Sincronizza l'orientamento grafico nel caso in cui il marker venga aggiornato o ridisegnato
  const cone = document.querySelector('.user-cone');
  if (cone && currentHeading !== null) {
    cone.style.display = 'block';
    cone.style.transform = `rotate(${currentHeading}deg)`;
  }

  tappe.forEach(t=>{
    const d=hav(lat,lng,t.lat,t.lng);
    if(d<100&&!alerted.has(t.id)){ alerted.add(t.id); showToast(t,d); }
    if(d>100) alerted.delete(t.id);
  });
}

function handleOrientation(e) {
  // webkitCompassHeading per iOS, e.alpha standard assoluto per sistemi Android Chrome
  if (e.webkitCompassHeading) {
    currentHeading = e.webkitCompassHeading;
  } else if (e.alpha !== null) {
    currentHeading = 360 - e.alpha; 
  }
  
  if (currentHeading !== null) {
    const cone = document.querySelector('.user-cone');
    if (cone) {
      cone.style.display = 'block';
      cone.style.transform = `rotate(${currentHeading}deg)`;
    }
  }
}

function initOrientation() {
  // Richiesta esplicita permessi per sistemi iOS (Apple richiede interazione utente come un click)
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(permissionState => {
        if (permissionState === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation);
        }
      })
      .catch(err => console.log('Bussola non autorizzata o non disponibile:', err));
  } else {
    // Sistemi Android o browser desktop standard
    if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', handleOrientation);
    } else {
      window.addEventListener('deviceorientation', handleOrientation);
    }
  }
}

function showToast(t,d){
  clearTimeout(toastTmr);
  const toast=document.getElementById('toast');
  document.getElementById('toastTitle').textContent=`Tappa ${t.id}: ${t.title}`;
  document.getElementById('toastSub').textContent=`Sei a ${Math.round(d)} metri!`;
  document.getElementById('toastBtn').onclick=()=>{ selectTappa(tappe.findIndex(x=>x.id===t.id)); toast.classList.remove('show'); };
  toast.classList.add('show');
  toastTmr=setTimeout(()=>toast.classList.remove('show'),7000);
}

btnLocate.addEventListener('click',()=>{
  // Attiva i sensori di orientamento e bussola al tocco
  initOrientation();
  
  if(uLoc) map.setView([uLoc.lat,uLoc.lng],17,{animate:true});
  else navigator.geolocation?.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],17));
});

btnPlayPause.addEventListener('click', togglePlayPause);

if(navigator.geolocation) nAavigator.geolocation.watchPosition(onGPS,null,{enableHighAccuracy:true,maximumAge:0,timeout:10000});

setSnap('closed');
</script>
